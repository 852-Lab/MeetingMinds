name: Backend CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.10'
        enable-cache: true
        
    - name: Install Python dependencies
      run: |
        uv sync --extra dev
        
    - name: Run backend tests
      run: |
        uv run pytest
