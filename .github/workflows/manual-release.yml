name: Manual Release

on:
  workflow_dispatch:

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.version_info.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git

      - name: Determine Version
        id: version_info
        run: |
          if [ "${{ steps.semantic.outputs.new_release_published }}" == "true" ]; then
            echo "version=${{ steps.semantic.outputs.new_release_version }}" >> $GITHUB_OUTPUT
          else
            # Fallback for manual testing: Use version from package.json or a timestamp
            PACKAGE_VERSION=$(node -p "require('./src/frontend/package.json').version")
            echo "version=${PACKAGE_VERSION}-dev" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    name: Build & Push Docker Image
    needs: release
    # Run if manual trigger OR if a new release was actually published
    if: github.event_name == 'workflow_dispatch' || needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Docker tags
        id: tags
        run: |
          # Lowercase the repository name
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          VERSION=${{ needs.release.outputs.new_release_version }}
          TAGS="ghcr.io/$REPO_LOWER/frontend:latest"
          if [ "${{ needs.release.outputs.new_release_published }}" == "true" ]; then
            TAGS="$TAGS,ghcr.io/$REPO_LOWER/frontend:$VERSION"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "repo_lower=$REPO_LOWER" >> $GITHUB_OUTPUT

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  generate-client:
    name: Generate MacOS Client (${{ matrix.arch }})
    needs: [release]
    # Run if manual trigger OR if a new release was published
    if: github.event_name == 'workflow_dispatch' || needs.release.outputs.new_release_published == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: arm64
            os: macos-14
          - arch: x64
            os: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './src/frontend/package-lock.json'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        env:
          INSTALLER_PRINT_VERBOSE: 1

      - name: Build Backend Binary
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv
          source .venv/bin/activate
          uv pip install . pyinstaller
          cd src/backend
          # Use pyinstaller to create a single-file executable
          # We include hidden imports that might be missed
          pyinstaller --onefile --name backend \
            --collect-all fastapi \
            --collect-all uvicorn \
            --collect-all pydantic \
            entry_point.py
          mkdir -p ../../backend-bin
          cp dist/backend ../../backend-bin/

      - name: Install Frontend dependencies
        run: |
          cd src/frontend
          # We use npm install instead of npm ci to handle the recently updated lockfile
          npm install

      - name: Set App Version
        run: |
          cd src/frontend
          npm version ${{ needs.release.outputs.new_release_version }} --no-git-tag-version

      - name: Build Standalone Electron App
        run: |
          cd src/frontend
          npm run build
          npx electron-builder --mac --${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_SKIP: true

      - name: Prepare Artifacts
        run: |
          mv dist-electron/MeetingMinds-${{ needs.release.outputs.new_release_version }}-${{ matrix.arch }}-mac.zip MeetingMinds-mac-${{ matrix.arch }}.zip

      - name: Upload Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: MeetingMinds-mac-${{ matrix.arch }}
          path: MeetingMinds-mac-${{ matrix.arch }}.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.new_release_version }}
          files: MeetingMinds-mac-${{ matrix.arch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
