services:
  backend:
    build:
      context: ./src/backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_API_URL=http://ollama:11434/api/generate
      - SONA_URL=http://sona:8000/v1
    volumes:
      - ./src/backend/storage:/app/storage
      - ./src/backend/models:/app/models
    depends_on:
      - ollama
      - sona

  sona:
    image: fedirz/faster-whisper-server:latest-cpu
    ports:
      - "52341:8000"
    volumes:
      - ./src/backend/models:/app/models
    environment:
      - WHISPER__MODEL=Systran/faster-distil-whisper-large-v3
      - WHISPER__COMPUTE_TYPE=int8
      - HF_HOME=/app/models

  frontend:
    build:
      context: ./src/frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
